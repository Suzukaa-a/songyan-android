name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      # Same inputs as the engine cache key in native/android/CMakeLists.txt; a stale entry
      # inside the restored directory is simply never picked.
      - uses: actions/cache@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
          key: native-check-${{ runner.os }}-ndk30.0.16248370-${{ hashFiles('native/*.env', 'native/patches/**', 'native/scripts/**', 'native/src/*.h', 'native/levers/include/**', 'native/android/engine/**') }}
      - name: ktlint
        run: ./gradlew --console=plain ktlintCheck
      - name: Lint and unit tests
        run: ./gradlew --console=plain lint test
      - name: Assemble debug and release APKs and the benchmark module
        run: ./gradlew --console=plain assembleDebug assembleRelease :benchmark:assemble
      - name: Check the packaged native engine
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            scripts/check-native-engine.sh "$apk"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/**
          retention-days: 7

  # Runs only when the repository variable IOS_REPOSITORY (owner/name of the iOS repository)
  # is set; add the secret IOS_CHECKOUT_TOKEN as well when that repository is private.
  # Without it the job is skipped, so forks and fresh clones stay green.
  ios-sync:
    if: ${{ vars.IOS_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.IOS_REPOSITORY }}
          token: ${{ secrets.IOS_CHECKOUT_TOKEN || github.token }}
          path: ios
          fetch-depth: 0
      - name: Compare synced files with the recorded iOS commit
        run: scripts/check-ios-sync.sh "$GITHUB_WORKSPACE/ios"

  # Engine replay and editor behaviour need a real device runtime. x86_64 keeps the native
  # build to one ABI; the other ABIs are covered by the check job's library inspection.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      # Same inputs as the engine cache key in native/android/CMakeLists.txt; a stale entry
      # inside the restored directory is simply never picked.
      - uses: actions/cache@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
          key: native-emulator-${{ runner.os }}-ndk30.0.16248370-${{ hashFiles('native/*.env', 'native/patches/**', 'native/scripts/**', 'native/src/*.h', 'native/levers/include/**', 'native/android/engine/**') }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # One module per call: modules listed together run in parallel on the same device and disturb each other.
          script: |
            ./gradlew --console=plain -Psongyan.abis=x86_64 :core:rime:connectedDebugAndroidTest
            ./gradlew --console=plain -Psongyan.abis=x86_64 :ime:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 7

  # Latency gate: the keyboard's show, key and commit times on a release-like build must stay within
  # the budgets in scripts/check-perf-budget.py.
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
          key: native-benchmark-${{ runner.os }}-ndk30.0.16248370-${{ hashFiles('native/*.env', 'native/patches/**', 'native/scripts/**', 'native/src/*.h', 'native/levers/include/**', 'native/android/engine/**') }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew --console=plain -Psongyan.abis=x86_64 :benchmark:connectedBenchmarkReleaseAndroidTest
            python3 scripts/check-perf-budget.py benchmark/build/outputs/connected_android_test_additional_output/benchmarkRelease/connected/*/*benchmarkData.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark/build/outputs/connected_android_test_additional_output/**
          retention-days: 7
