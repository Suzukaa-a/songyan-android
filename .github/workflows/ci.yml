name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same checks before it builds anything.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired `tools` package, which sdkmanager no longer finds.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      # Same inputs as the engine cache key in native/android/CMakeLists.txt; a stale entry
      # inside the restored directory is simply never picked.
      - uses: actions/cache@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
          key: native-check-${{ runner.os }}-ndk30.0.16248370-${{ hashFiles('native/*.env', 'native/patches/**', 'native/scripts/**', 'native/src/*.h', 'native/levers/include/**', 'native/android/engine/**') }}
      - name: ktlint
        run: ./gradlew --console=plain ktlintCheck
      - name: Lint and unit tests
        run: ./gradlew --console=plain lint test
      - name: Assemble debug and release APKs and the benchmark module
        run: ./gradlew --console=plain assembleDebug assembleRelease :benchmark:assemble
      - name: Check the packaged native engine
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            scripts/check-native-engine.sh "$apk"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/**
          retention-days: 7

  # Runs only when the repository variable IOS_REPOSITORY (owner/name of the iOS repository)
  # is set; add the secret IOS_CHECKOUT_TOKEN as well when that repository is private.
  # Without it the job is skipped, so forks and fresh clones stay green.
  ios-sync:
    if: ${{ vars.IOS_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.IOS_REPOSITORY }}
          token: ${{ secrets.IOS_CHECKOUT_TOKEN || github.token }}
          path: ios
          fetch-depth: 0
      - name: Compare synced files with the recorded iOS commit
        run: scripts/check-ios-sync.sh "$GITHUB_WORKSPACE/ios"

  # Engine replay and editor behaviour need a real device runtime. GitHub's hosted Linux runners
  # only accelerate x86_64 emulators (an arm64 image there is fully emulated and far too slow), so
  # behaviour is tested on x86_64; every ABI's engine, arm64-v8a included, is built and inspected by
  # the check job. API 26 is the minimum supported version.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired `tools` package, which sdkmanager no longer finds.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      # Same inputs as the engine cache key in native/android/CMakeLists.txt; a stale entry
      # inside the restored directory is simply never picked.
      - uses: actions/cache@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
          key: native-emulator-${{ runner.os }}-ndk30.0.16248370-${{ hashFiles('native/*.env', 'native/patches/**', 'native/scripts/**', 'native/src/*.h', 'native/levers/include/**', 'native/android/engine/**') }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          # Without a profile the emulator is 320 dp wide, narrower than the phones the suite is
          # written for; a Pixel 6 is a common 411 dp phone.
          profile: pixel_6
          disable-animations: true
          # One module per call: modules listed together run in parallel on the same device and disturb each other.
          script: |
            ./gradlew --console=plain -Psongyan.abis=x86_64 :ime:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.songyan.ime.ime.LeakProbeTmpTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports-api${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 7
