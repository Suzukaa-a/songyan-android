name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two halves on separate runners so the wall time is the slower one, not the sum: static checks
  # and JVM tests never build the native engine, the APK builds need it.
  check:
    name: check (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [lint-test, assemble]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired `tools` package, which sdkmanager no longer finds.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      # The engine key also covers the compiler and flags, which no file hash sees, so the cache
      # restores the latest entry and is saved under the names of the engines a build used.
      - name: Restore engine cache
        id: native
        if: matrix.part == 'assemble'
        uses: actions/cache/restore@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
          key: native-check-${{ runner.os }}-latest
          restore-keys: native-check-${{ runner.os }}-
      - name: Mark the build start
        if: matrix.part == 'assemble'
        run: mkdir -p .local && touch .local/native-build-start
      - name: ktlint, lint and unit tests
        if: matrix.part == 'lint-test'
        run: ./gradlew --console=plain ktlintCheck lint test
      - name: Assemble debug and release APKs and the benchmark module
        if: matrix.part == 'assemble'
        run: ./gradlew --console=plain assembleDebug assembleRelease :benchmark:assemble
      - name: Check the packaged native engine
        if: matrix.part == 'assemble'
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            scripts/check-native-engine.sh "$apk"
          done
      - name: Key the engine cache on the engines this build used
        id: engines
        if: matrix.part == 'assemble'
        run: scripts/ci-native-cache-key.sh native-check-${{ runner.os }} >>"$GITHUB_OUTPUT"
      - name: Save engine cache
        if: matrix.part == 'assemble' && steps.engines.outputs.key != steps.native.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
          key: ${{ steps.engines.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.part }}
          path: |
            **/build/reports/**
          retention-days: 7

  # Runs only when the repository variable IOS_REPOSITORY (owner/name of the iOS repository)
  # is set; add the secret IOS_CHECKOUT_TOKEN as well when that repository is private.
  # Without it the job is skipped, so forks and fresh clones stay green.
  ios-sync:
    if: ${{ vars.IOS_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.IOS_REPOSITORY }}
          token: ${{ secrets.IOS_CHECKOUT_TOKEN || github.token }}
          path: ios
          fetch-depth: 0
      - name: Compare synced files with the recorded iOS commit
        run: scripts/check-ios-sync.sh "$GITHUB_WORKSPACE/ios"

  # Engine replay and editor behaviour need a real device runtime. GitHub's hosted Linux runners
  # only accelerate x86_64 emulators (an arm64 image there is fully emulated and far too slow), so
  # behaviour is tested on x86_64; every ABI's engine, arm64-v8a included, is built and inspected by
  # the check job. API 30 is the minimum supported version.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # The instrumented suites take most of the job, so each API level splits them over two
      # emulators with AndroidJUnitRunner's numShards/shardIndex.
      matrix:
        api: [{ level: 30, target: default }, { level: 34, target: google_apis }]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired `tools` package, which sdkmanager no longer finds.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      # Keyed on the engines a build used, as in the check job.
      - name: Restore engine cache
        id: native
        uses: actions/cache/restore@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
          key: native-emulator-${{ runner.os }}-latest
          restore-keys: native-emulator-${{ runner.os }}-
      - name: Mark the build start
        run: mkdir -p .local && touch .local/native-build-start
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api.level }}
          arch: x86_64
          target: ${{ matrix.api.target }}
          # Without a profile the emulator is 320 dp wide, narrower than the phones the suite is
          # written for; a Pixel 6 is a common 411 dp phone.
          profile: pixel_6
          disable-animations: true
          # One module per call: modules listed together run in parallel on the same device and disturb each other.
          # A freshly booted Google APIs image can show "Pixel Launcher isn't responding" over the
          # keyboard; the suite tests the keyboard, not the launcher, so error dialogs stay hidden.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew --console=plain -Psongyan.abis=x86_64 -Pandroid.testInstrumentationRunnerArguments.numShards=2 -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }} :core:rime:connectedDebugAndroidTest
            ./gradlew --console=plain -Psongyan.abis=x86_64 -Pandroid.testInstrumentationRunnerArguments.numShards=2 -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }} :ime:connectedDebugAndroidTest
      - name: Key the engine cache on the engines this build used
        id: engines
        run: scripts/ci-native-cache-key.sh native-emulator-${{ runner.os }} >>"$GITHUB_OUTPUT"
      # Only the first shard saves; the others build the same x86_64 engine.
      - name: Save engine cache
        if: matrix.shard == 0 && matrix.api.level == 30 && steps.engines.outputs.key != steps.native.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
          key: ${{ steps.engines.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports-api${{ matrix.api.level }}-shard${{ matrix.shard }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 7
