name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two halves on separate runners so the wall time is the slower one, not the sum: static checks
  # and JVM tests never build the native engine, the APK builds need it.
  check:
    name: check (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [lint-test, assemble]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired `tools` package, which sdkmanager no longer finds.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      # The engine key also covers the compiler and flags, which no file hash sees, so the cache
      # restores the latest entry and is saved under the names of the engines a build used.
      - name: Restore engine cache
        id: native
        if: matrix.part == 'assemble'
        uses: actions/cache/restore@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
            .local/script-vendor
          key: native-check-${{ runner.os }}-latest
          restore-keys: native-check-${{ runner.os }}-
      - name: Mark the build start
        if: matrix.part == 'assemble'
        run: mkdir -p .local && touch .local/native-build-start
      - name: Dependency boundaries
        if: matrix.part == 'lint-test'
        run: ./gradlew --console=plain checkDependencyBoundaries --no-configuration-cache
      - name: Script helper tests
        if: matrix.part == 'lint-test'
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v
      - name: Generated Traditional Chinese resources
        if: matrix.part == 'lint-test'
        run: |
          # The generator pins OpenCC 1.1.9; a distro package converts differently and would
          # fail the comparison for the wrong reason, so build the pinned version here. Its sources
          # predate GCC 13, which no longer pulls <cstdint> in transitively.
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ make
          git clone --depth 1 --branch ver.1.1.9 --recurse-submodules --shallow-submodules \
            https://github.com/BYVoid/OpenCC.git "$RUNNER_TEMP/opencc-src"
          cmake -S "$RUNNER_TEMP/opencc-src" -B "$RUNNER_TEMP/opencc-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/opencc" \
            -DBUILD_PYTHON=OFF -DBUILD_TESTING=OFF -DBUILD_DOCUMENTATION=OFF \
            -DCMAKE_CXX_FLAGS="-include cstdint"
          cmake --build "$RUNNER_TEMP/opencc-build" --parallel 2
          cmake --install "$RUNNER_TEMP/opencc-build"
          export PATH="$RUNNER_TEMP/opencc/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/opencc/lib:$RUNNER_TEMP/opencc/lib64:${LD_LIBRARY_PATH:-}"
          opencc --version
          scripts/gen-zh-hant-strings.sh --check
      - name: ktlint, lint and unit tests
        if: matrix.part == 'lint-test'
        run: ./gradlew --console=plain ktlintCheck lint test
      - name: Assemble debug and release APKs, the benchmark module and the script library
        if: matrix.part == 'assemble'
        run: ./gradlew --console=plain assembleDebug assembleRelease :benchmark:assemble :script:assembleDebug
      # The script library must exist for every ABI the engine builds; QuickJS is fetched from
      # the pinned archive and digest-checked during the CMake configure above.
      - name: Check the script library exists for every ABI
        if: matrix.part == 'assemble'
        run: |
          for abi in arm64-v8a x86_64 armeabi-v7a; do
            found=$(find "script/build/intermediates/cxx" -path "*$abi*" -name libsongyan-script.so | head -1)
            [ -n "$found" ] || { echo "missing libsongyan-script.so for $abi"; exit 1; }
          done
      - name: Check the packaged native engine
        if: matrix.part == 'assemble'
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            scripts/check-native-engine.sh "$apk"
          done
      - name: Check the shrunk release keeps the script JNI entry points
        if: matrix.part == 'assemble'
        run: scripts/check-release-mapping.sh app/build/outputs/mapping/release/mapping.txt
      - name: Check the script library is packaged for every ABI
        if: matrix.part == 'assemble'
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            scripts/check-apk-script-library.sh "$apk"
          done
      - name: Key the engine cache on the engines this build used
        id: engines
        if: matrix.part == 'assemble'
        run: scripts/ci-native-cache-key.sh native-check-${{ runner.os }} >>"$GITHUB_OUTPUT"
      - name: Save engine cache
        if: matrix.part == 'assemble' && steps.engines.outputs.key != steps.native.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
            .local/script-vendor
          key: ${{ steps.engines.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.part }}
          path: |
            **/build/reports/**
          retention-days: 7

  # Runs only when the repository variable IOS_REPOSITORY (owner/name of the iOS repository)
  # is set; add the secret IOS_CHECKOUT_TOKEN as well when that repository is private.
  # Without it the job is skipped, so forks and fresh clones stay green.
  ios-sync:
    if: ${{ vars.IOS_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.IOS_REPOSITORY }}
          token: ${{ secrets.IOS_CHECKOUT_TOKEN || github.token }}
          path: ios
          fetch-depth: 0
      - name: Compare synced files with the recorded iOS commit
        run: scripts/check-ios-sync.sh "$GITHUB_WORKSPACE/ios"

  # Engine replay and editor behaviour need a real device runtime. GitHub's hosted Linux runners
  # only accelerate x86_64 emulators (an arm64 image there is fully emulated and far too slow), so
  # behaviour is tested on x86_64; every ABI's engine, arm64-v8a included, is built and inspected by
  # the check job. API 30 is the minimum supported version.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # The instrumented suites take most of the job, so each API level splits them over two
      # emulators with AndroidJUnitRunner's numShards/shardIndex.
      matrix:
        api: [{ level: 30, target: default }, { level: 34, target: google_apis }]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired `tools` package, which sdkmanager no longer finds.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      # Keyed on the engines a build used, as in the check job.
      - name: Restore engine cache
        id: native
        uses: actions/cache/restore@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
            .local/script-vendor
          key: native-emulator-${{ runner.os }}-latest
          restore-keys: native-emulator-${{ runner.os }}-
      - name: Mark the build start
        run: mkdir -p .local && touch .local/native-build-start
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api.level }}
          arch: x86_64
          target: ${{ matrix.api.target }}
          # Without a profile the emulator is 320 dp wide, narrower than the phones the suite is
          # written for; a Pixel 6 is a common 411 dp phone.
          profile: pixel_6
          disable-animations: true
          # One module per call: modules listed together run in parallel on the same device and disturb each other.
          # A freshly booted Google APIs image can show "Pixel Launcher isn't responding" over the
          # keyboard; the suite tests the keyboard, not the launcher, so error dialogs stay hidden.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew --console=plain -Psongyan.abis=x86_64 -Pandroid.testInstrumentationRunnerArguments.numShards=2 -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }} :core:rime:connectedDebugAndroidTest
            python3 scripts/check-instrumented-results.py 5 core/rime/build/outputs/androidTest-results/connected
            ./gradlew --console=plain -Psongyan.abis=x86_64 -Pandroid.testInstrumentationRunnerArguments.numShards=2 -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }} :ime:connectedDebugAndroidTest
            python3 scripts/check-instrumented-results.py 100 ime/build/outputs/androidTest-results/connected
            # Script cases run the shared engine inside an isolated process on the emulator.
            ./gradlew --console=plain -Psongyan.abis=x86_64 -Pandroid.testInstrumentationRunnerArguments.numShards=2 -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }} :script:connectedDebugAndroidTest
            python3 scripts/check-instrumented-results.py 5 script/build/outputs/androidTest-results/connected
      - name: Key the engine cache on the engines this build used
        id: engines
        run: scripts/ci-native-cache-key.sh native-emulator-${{ runner.os }} >>"$GITHUB_OUTPUT"
      # Only the first shard saves; the others build the same x86_64 engine.
      - name: Save engine cache
        if: matrix.shard == 0 && matrix.api.level == 30 && steps.engines.outputs.key != steps.native.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
            .local/script-vendor
          key: ${{ steps.engines.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports-api${{ matrix.api.level }}-shard${{ matrix.shard }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 7

  # The host-side addon integration tests bind a real second APK (addon-sample). Installing it is a
  # separate step from building it, and the tests skip themselves when it is missing, so a plain
  # ./gradlew :app:connectedDebugAndroidTest on another machine stays green without the sample.
  addon-host:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      # Reads the emulator jobs' x86_64 engine cache; this job never saves it.
      - name: Restore engine cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .local/native-cache
            .local/cmake-deps
            .local/script-vendor
          key: native-emulator-${{ runner.os }}-latest
          restore-keys: native-emulator-${{ runner.os }}-
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # The host tests bind the sample as a real APK; its own suite uninstalls it when done, so it
          # is installed again before the app suite. Error dialogs stay hidden as in the emulator job.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew --console=plain -Psongyan.abis=x86_64 :addon-sample:assembleDebug
            adb install -r addon-sample/build/outputs/apk/debug/addon-sample-debug.apk
            ./gradlew --console=plain -Psongyan.abis=x86_64 :addon-sample:connectedDebugAndroidTest
            python3 scripts/check-instrumented-results.py --no-skips 12 addon-sample/build/outputs/androidTest-results/connected
            adb install -r addon-sample/build/outputs/apk/debug/addon-sample-debug.apk
            ./gradlew --console=plain -Psongyan.abis=x86_64 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=app.songyan.ime.addons
            python3 scripts/check-instrumented-results.py --no-skips 24 app/build/outputs/androidTest-results/connected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: addon-host-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 7
