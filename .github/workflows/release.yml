name: Release

# Pushing a tag vX.Y.Z on a commit of main publishes release X.Y.Z. Running the workflow by hand on
# main publishes a pre-release (the dev channel) named after the latest release and the commit count,
# e.g. 0.2.0 (1234), tagged v0.2.0-1234. Either way it waits for that commit's CI run on main to pass
# (it is not run a second time), then builds the signed release APKs (one per ABI plus a universal
# one) and publishes a GitHub Release. The version code is always the commit count.
#
# The release notes are the changelog: for a release, the body of the signed tag's message (first line
# the version, a blank line, then the notes); for a pre-release, the `notes` input. A release without
# notes fails before anything is built.
#
# Repository secrets: SONGYAN_KEYSTORE_BASE64 (the keystore file, base64), SONGYAN_KEYSTORE_PASSWORD,
# SONGYAN_KEY_ALIAS, SONGYAN_KEY_PASSWORD. Without all four the run fails before anything is built,
# so a release is never signed with a debug key.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      notes:
        description: 更新日志（自上一次发布以来的变化）
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Cheap rejections first, so a wrong tag or missing secret does not wait for the emulator jobs.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.version.outputs.full }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      files: ${{ steps.version.outputs.files }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The version code counts commits, and the main check needs the branch history.
          fetch-depth: 0
      - name: Read the version
        id: version
        env:
          REF: ${{ github.ref_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${REF} is not on main"; exit 1; }
          code="$(git rev-list --count HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "${GITHUB_REF}" == refs/heads/main ]] \
              || { echo "::error::run the pre-release on main, not ${REF}"; exit 1; }
            release="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude 'v*-*' HEAD)" \
              || { echo "::error::no vX.Y.Z release tag on main yet"; exit 1; }
            base="${release#v}"
            full="${base} (${code})" tag="v${base}-${code}" files="${base}-${code}" prerelease=true
            [[ -n "${NOTES//[[:space:]]/}" ]] || { echo "::error::write the changelog in the notes input"; exit 1; }
          else
            [[ "${REF}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] \
              || { echo "::error::tag ${REF} is not vX.Y.Z"; exit 1; }
            full="${REF#v}" tag="${REF}" files="${REF#v}" prerelease=false
            # Checkout may leave a lightweight copy of the tag; fetch the annotated one to read its message.
            git fetch --quiet --force origin "refs/tags/${REF}:refs/tags/${REF}"
            [[ "$(git cat-file -t "${REF}")" == tag ]] || { echo "::error::${REF} is not an annotated tag"; exit 1; }
            body="$(git for-each-ref --format='%(contents:body)' "refs/tags/${REF}")"
            [[ -n "${body//[[:space:]]/}" ]] \
              || { echo "::error::${REF} has no changelog in its message (version line, blank line, notes)"; exit 1; }
          fi
          {
            echo "full=${full}"
            echo "code=${code}"
            echo "tag=${tag}"
            echo "files=${files}"
            echo "prerelease=${prerelease}"
          } >>"${GITHUB_OUTPUT}"
      - name: Require the signing secrets
        env:
          SONGYAN_KEYSTORE_BASE64: ${{ secrets.SONGYAN_KEYSTORE_BASE64 }}
          SONGYAN_KEYSTORE_PASSWORD: ${{ secrets.SONGYAN_KEYSTORE_PASSWORD }}
          SONGYAN_KEY_ALIAS: ${{ secrets.SONGYAN_KEY_ALIAS }}
          SONGYAN_KEY_PASSWORD: ${{ secrets.SONGYAN_KEY_PASSWORD }}
        run: |
          missing=()
          for name in SONGYAN_KEYSTORE_BASE64 SONGYAN_KEYSTORE_PASSWORD SONGYAN_KEY_ALIAS SONGYAN_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          if ((${#missing[@]})); then
            echo "::error::missing repository secrets: ${missing[*]}"
            exit 1
          fi

  checks:
    name: Wait for CI
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: Wait for the CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # A manual run (workflow_dispatch) counts too, for a commit whose push did not run CI.
        run: |
          while :; do
            run="$(gh run list -R "${REPO}" --workflow ci.yml --commit "${SHA}" --limit 20 \
              --json status,conclusion,event,url \
              --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0] // empty')"
            if [[ -z "${run}" ]]; then
              echo "::error::no CI run on main for ${SHA}; run the CI workflow on main, then push the tag again"
              exit 1
            fi
            status="$(jq -r .status <<<"${run}")"
            conclusion="$(jq -r .conclusion <<<"${run}")"
            url="$(jq -r .url <<<"${run}")"
            if [[ "${status}" == completed ]]; then
              [[ "${conclusion}" == success ]] \
                || { echo "::error::CI for ${SHA} ended ${conclusion}: ${url}"; exit 1; }
              echo "CI passed: ${url}"
              exit 0
            fi
            echo "CI ${status}: ${url}"
            sleep 60
          done

  publish:
    name: Publish
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.full }}
      VERSION_CODE: ${{ needs.validate.outputs.code }}
      TAG: ${{ needs.validate.outputs.tag }}
      FILES: ${{ needs.validate.outputs.files }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired `tools` package, which sdkmanager no longer finds.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the keystore
        env:
          SONGYAN_KEYSTORE_BASE64: ${{ secrets.SONGYAN_KEYSTORE_BASE64 }}
        run: |
          keystore="${RUNNER_TEMP}/songyan-release.jks"
          printf '%s' "${SONGYAN_KEYSTORE_BASE64}" | base64 --decode >"${keystore}"
          chmod 600 "${keystore}"
          echo "SONGYAN_KEYSTORE_FILE=${keystore}" >>"${GITHUB_ENV}"
      # All ABIs: no -Psongyan.abis.
      - name: Build the signed release APKs
        env:
          SONGYAN_KEYSTORE_PASSWORD: ${{ secrets.SONGYAN_KEYSTORE_PASSWORD }}
          SONGYAN_KEY_ALIAS: ${{ secrets.SONGYAN_KEY_ALIAS }}
          SONGYAN_KEY_PASSWORD: ${{ secrets.SONGYAN_KEY_PASSWORD }}
        run: |
          ./gradlew --console=plain assembleRelease -Psongyan.abiSplits=true \
            "-Psongyan.versionName=${VERSION}" "-Psongyan.versionCode=${VERSION_CODE}"
      - name: Collect and verify the APKs
        run: |
          build_tools="${ANDROID_HOME}/build-tools/37.0.0"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            apk="dist/Songyan-${FILES}-${abi}.apk"
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "${apk}"
            # A debug-signed or unsigned package must never be published as a release.
            certs="$("${build_tools}/apksigner" verify --verbose --print-certs "${apk}")"
            echo "${certs}"
            ! grep -q "CN=Android Debug" <<<"${certs}" \
              || { echo "::error::${apk} is signed with the debug key"; exit 1; }
            badging="$("${build_tools}/aapt2" dump badging "${apk}" | head -1)"
            echo "${badging}"
            [[ "${badging}" == *"versionCode='${VERSION_CODE}'"* && "${badging}" == *"versionName='${VERSION}'"* ]] \
              || { echo "::error::${apk} does not carry version ${VERSION} (${VERSION_CODE})"; exit 1; }
            if [[ "${abi}" == universal ]]; then
              scripts/check-native-engine.sh "${apk}"
            else
              scripts/check-native-engine.sh "${apk}" --abi "${abi}"
            fi
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        # A pre-release has no pushed tag: the release creates it on the commit that was built.
        run: |
          flags=(--title "松烟 ${VERSION}")
          if [[ "${PRERELEASE}" == true ]]; then
            flags+=(--prerelease --target "${GITHUB_SHA}" --notes "${NOTES}")
          else
            git fetch --quiet --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            flags+=(--verify-tag --notes "$(git for-each-ref --format='%(contents:body)' "refs/tags/${TAG}")")
          fi
          gh release create "${TAG}" dist/* "${flags[@]}"
      - name: Remove the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/songyan-release.jks"
