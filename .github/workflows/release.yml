name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix, e.g. v0.2.0-dev.1, for a pre-release) on a commit of main
# waits for that commit's CI run on main to pass (it is not run a second time), then builds the
# signed release APK and AAB and publishes a GitHub Release. A tag with a
# suffix is marked as a pre-release: that is the dev channel.
#
# Repository secrets: SONGYAN_KEYSTORE_BASE64 (the keystore file, base64), SONGYAN_KEYSTORE_PASSWORD,
# SONGYAN_KEY_ALIAS, SONGYAN_KEY_PASSWORD. Without all four the run fails before anything is built,
# so a release is never signed with a debug key.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Cheap rejections first, so a wrong tag or missing secret does not wait for the emulator jobs.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.version.outputs.full }}
      code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The version code counts commits, and the main check needs the branch history.
          fetch-depth: 0
      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::tag ${TAG} is not vX.Y.Z or vX.Y.Z-suffix"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::tag ${TAG} is not on main"; exit 1; }
          {
            echo "full=${TAG#v}"
            echo "code=$(git rev-list --count HEAD)"
            echo "prerelease=$([[ -n "${BASH_REMATCH[2]}" ]] && echo true || echo false)"
          } >>"${GITHUB_OUTPUT}"
      - name: Require the signing secrets
        env:
          SONGYAN_KEYSTORE_BASE64: ${{ secrets.SONGYAN_KEYSTORE_BASE64 }}
          SONGYAN_KEYSTORE_PASSWORD: ${{ secrets.SONGYAN_KEYSTORE_PASSWORD }}
          SONGYAN_KEY_ALIAS: ${{ secrets.SONGYAN_KEY_ALIAS }}
          SONGYAN_KEY_PASSWORD: ${{ secrets.SONGYAN_KEY_PASSWORD }}
        run: |
          missing=()
          for name in SONGYAN_KEYSTORE_BASE64 SONGYAN_KEYSTORE_PASSWORD SONGYAN_KEY_ALIAS SONGYAN_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          if ((${#missing[@]})); then
            echo "::error::missing repository secrets: ${missing[*]}"
            exit 1
          fi

  checks:
    name: Wait for CI
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: Wait for the CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # A manual run (workflow_dispatch) counts too, for a commit whose push did not run CI.
        run: |
          while :; do
            run="$(gh run list -R "${REPO}" --workflow ci.yml --commit "${SHA}" --limit 20 \
              --json status,conclusion,event,url \
              --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0] // empty')"
            if [[ -z "${run}" ]]; then
              echo "::error::no CI run on main for ${SHA}; run the CI workflow on main, then push the tag again"
              exit 1
            fi
            status="$(jq -r .status <<<"${run}")"
            conclusion="$(jq -r .conclusion <<<"${run}")"
            url="$(jq -r .url <<<"${run}")"
            if [[ "${status}" == completed ]]; then
              [[ "${conclusion}" == success ]] \
                || { echo "::error::CI for ${SHA} ended ${conclusion}: ${url}"; exit 1; }
              echo "CI passed: ${url}"
              exit 0
            fi
            echo "CI ${status}: ${url}"
            sleep 60
          done

  publish:
    name: Publish
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.full }}
      VERSION_CODE: ${{ needs.validate.outputs.code }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired `tools` package, which sdkmanager no longer finds.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the keystore
        env:
          SONGYAN_KEYSTORE_BASE64: ${{ secrets.SONGYAN_KEYSTORE_BASE64 }}
        run: |
          keystore="${RUNNER_TEMP}/songyan-release.jks"
          printf '%s' "${SONGYAN_KEYSTORE_BASE64}" | base64 --decode >"${keystore}"
          chmod 600 "${keystore}"
          echo "SONGYAN_KEYSTORE_FILE=${keystore}" >>"${GITHUB_ENV}"
      # All ABIs: no -Psongyan.abis.
      - name: Build the signed release APK and AAB
        env:
          SONGYAN_KEYSTORE_PASSWORD: ${{ secrets.SONGYAN_KEYSTORE_PASSWORD }}
          SONGYAN_KEY_ALIAS: ${{ secrets.SONGYAN_KEY_ALIAS }}
          SONGYAN_KEY_PASSWORD: ${{ secrets.SONGYAN_KEY_PASSWORD }}
        run: |
          ./gradlew --console=plain assembleRelease bundleRelease \
            "-Psongyan.versionName=${VERSION}" "-Psongyan.versionCode=${VERSION_CODE}"
      - name: Collect and verify the artifacts
        run: |
          build_tools="${ANDROID_HOME}/build-tools/37.0.0"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Songyan-${VERSION}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/Songyan-${VERSION}.aab"
          apk="dist/Songyan-${VERSION}.apk"
          # A debug-signed or unsigned package must never be published as a release.
          certs="$("${build_tools}/apksigner" verify --verbose --print-certs "${apk}")"
          echo "${certs}"
          ! grep -q "CN=Android Debug" <<<"${certs}" \
            || { echo "::error::the APK is signed with the debug key"; exit 1; }
          jarsigner -verify "dist/Songyan-${VERSION}.aab"
          badging="$("${build_tools}/aapt2" dump badging "${apk}" | head -1)"
          echo "${badging}"
          [[ "${badging}" == *"versionCode='${VERSION_CODE}'"* && "${badging}" == *"versionName='${VERSION}'"* ]] \
            || { echo "::error::the APK does not carry version ${VERSION} (${VERSION_CODE})"; exit 1; }
          scripts/check-native-engine.sh "${apk}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --generate-notes --title "松烟 ${VERSION}")
          [[ "${PRERELEASE}" != true ]] || flags+=(--prerelease)
          gh release create "${TAG}" dist/* "${flags[@]}"
      - name: Remove the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/songyan-release.jks"
