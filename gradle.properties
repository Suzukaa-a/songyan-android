# JVM args: large heap for native/dependency resolution and Kotlin compilation.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
kotlin.code.style=official

# The NDK build is opt-in per ABI list (see core/rime/build.gradle.kts and CONTRIBUTING.md).
# Kotlin compiles in-process: several Gradle daemons run in parallel on developer machines
# and a shared Kotlin daemon adds a contention point without speeding up small modules.
kotlin.compiler.execution.strategy=in-process

# Release identity (see app/build.gradle.kts for signing).
songyan.versionCode=1
songyan.versionName=0.1.0
